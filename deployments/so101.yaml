# RobotEnvironment scaffolded by `openral detect --deployment`.
# robot_id, hal.transport.port, and sensors were filled from detection.
# Detection cannot infer the rest — review before `openral deploy run`:
#   task   set — the job the robot should do (id + instruction)
#   safety — null → robots/so101_follower/robot.yaml limits apply;
#            set workspace_box_min/max_xyz + no_go_zones to tighten the cell.
#   cameras — readers carry device + fps only; a camera's physical mount
#            pose lives in the robot manifest's sensor frames, not here.
#   metadata.label — optional friendly name for this deployment.
# The driving rSkill is not pinned here — the reasoner selects it at
# runtime from the installed rskills/ registry, embodiment-filtered.
# Re-run with `--interactive` to be prompted for these instead.
robot_id: so101_follower
hal:
  adapter: so101_follower
  transport:
    port: /dev/ttyACM0
  params:
    calibrate_on_connect: false
    # lerobot calibration identity — the arm was calibrated with
    # `lerobot-calibrate --robot.id=so_follower`. The calibration is COMMITTED
    # next to this config (deployments/calibration/so_follower.json) and loaded
    # from there, so the deploy owns its calibration instead of depending on
    # whatever `<id>.json` happens to be in the ambient HF cache (that dir held
    # two differing so_follower calibrations for one arm — a silent footgun).
    # calibration_dir is resolved relative to THIS config file's directory by
    # `openral deploy run`. lerobot loads `<calibration_dir>/<id>.json`.
    id: so_follower
    calibration_dir: calibration
sensors:
- sensor_id: top
  backend: gstreamer
  backend_params:
    source: usb
    device: /dev/video0
    width: 640
    height: 480
    fps: 30
  max_age_ms: 100
  publish_to_ros: false
  publish_topic: null
  publish_rate_hz: null
# The icspring wrist cam is MJPG-only (v4l2-ctl --list-formats-ext shows no
# raw modes), and the builder's `source: usb` requests raw video/x-raw caps —
# v4l2src then dies with `not-negotiated (-4)`. A full pipeline string (the
# documented alternate form) decodes the JPEG stream explicitly. The two
# appsink names (bh_sink inference branch, ros_sink ROS-tee branch) mirror
# the builder's conventions in openral_runner/backends/gstreamer/pipeline.py.
- sensor_id: wrist
  backend: gstreamer
  backend_params:
    pipeline: >-
      v4l2src device=/dev/video4 !
      image/jpeg,width=640,height=480,framerate=30/1 ! jpegdec !
      videoconvert ! video/x-raw,format=BGR !
      tee name=openral_cam_tee
      openral_cam_tee. ! queue leaky=downstream max-size-buffers=2 !
      appsink name=bh_sink emit-signals=true max-buffers=1 drop=true sync=false
      openral_cam_tee. ! queue leaky=downstream max-size-buffers=2 !
      appsink name=ros_sink emit-signals=true max-buffers=1 drop=true sync=false
  max_age_ms: 100
  publish_to_ros: false
  publish_topic: null
  publish_rate_hz: null
task:
  id: so101/pick_pen
  scene_id: real_world
  instruction: Pick up the pen
  max_steps: null
  success_key: null
  metadata: {}
safety: null
rate_hz: 30.0
thumbnail_hz: 25.0
deadline_overrun_policy: warn
max_ticks: null
save_dir: null
metadata:
  generated_by: openral detect --deployment
  label: so101 laptop rig
  edit_before_deploy: []
