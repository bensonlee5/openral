schema_version: "0.1"
name: "OpenRAL/rskill-topreward-qwen3vl-4b-nf4"
version: "0.1.0"
# rSkill packaging is Apache-2.0 (ADR-0012). The TOPReward *method* is MIT and
# the wrapped Qwen3-VL-4B-Instruct *weights* are themselves Apache-2.0
# (Qwen/Qwen3-VL-4B-Instruct, license: apache-2.0), so redistributing a
# quantized copy is fully permitted — the whole stack is Apache-2.0 / MIT.
license: "apache-2.0"
role: "s2"
kind: "reward"

# Embodiment-agnostic: a reward monitor scores any rollout video + task
# instruction and is exempt from the rSkill<->robot embodiment gate.
embodiment_tags: ["any"]  # explicit embodiment-agnostic wildcard (ADR-0072)

# Consumes the same RGB camera stream the co-active VLA uses. No actuators.
sensors_required:
  - modality: "rgb"
    min_width: 224
    min_height: 224

actuators_required: []

runtime: "pytorch"

# NF4 bitsandbytes quantization of the Qwen3-VL-4B backbone. lerobot 0.6.0's
# TOPRewardModel loads the VLM bf16 with no quant knob, so the OpenRAL backend
# subclasses it to inject a BitsAndBytesConfig (see tools/topreward_per_frame_demo.py
# NF4TOPRewardModel). Measured: peak 3.13 GB for an 8-frame Qwen3-VL forward on
# an 8 GB GPU. transformers 5.x works (no downgrade pin, unlike Robometer).
quantization:
  dtype: "int4"
  backend: "pytorch"
  extra:
    scheme: "nf4"
    quantizer: "bitsandbytes"
    compute_dtype: "bfloat16"
    double_quant: "true"
    # Zero-shot: no fine-tuned checkpoint. The loader quantizes the base VLM
    # (weights_uri) at load time via lerobot's first-party reward abstraction.
    loader: "lerobot.rewards.topreward.TOPRewardModel(+bitsandbytes NF4)"

min_vram_gb:
  fp32: 18.0
  bf16: 9.0
  int4: 3.2  # measured 3.13 GB peak (8-frame prefix forward, RTX 4070 Laptop 8 GB)

# TOPReward is ZERO-SHOT: it has no fine-tuned weights of its own. The "weights"
# are the off-the-shelf Qwen3-VL-4B-Instruct VLM, quantized to NF4 at load. There
# is therefore no OpenRAL checkpoint to host — weights_uri points at the backbone.
weights_uri: "hf://Qwen/Qwen3-VL-4B-Instruct"

chunk_size: 1
latency_budget:
  # S2-cadence monitor over a frame window; not a per-control-step signal.
  per_chunk_ms: 3000.0

source_repo: "hf://Qwen/Qwen3-VL-4B-Instruct"
paper_url: "https://arxiv.org/abs/2602.19313"

# Reward / progress-monitor contract. TOPReward's model returns ONE clip-level
# scalar (log P("True" | video, instruction)); per-frame progress is produced by
# lerobot's native prefix sweep (compute_rabc_weights: score growing prefixes ->
# min-max normalise per episode -> interpolate to one value per frame in [0,1]).
reward:
  progress_range: [0.0, 1.0]
  # TOPReward's per-episode min-max normalization is UNCALIBRATED across episodes
  # (0/1 are the episode's own extremes), so these bars are advisory defaults, not
  # a physically-calibrated success bar like Robometer's. Live-measured on LIBERO
  # ep0 (a success demo): first-20%=0.41 rising to last-20%=0.92.
  success_threshold: 0.8
  check_floor: 0.5
  preference: false
  # Score the whole attempt from its start (TOPReward judges "is the task complete
  # by now"), matching Robometer's full-attempt window rather than a trailing tail.
  frame_window_s: 40.0
  target_fps: 2.0  # TOPRewardConfig default fps for the Qwen video processor
  instruction_required: true
  plateau_window_s: 3.0
  plateau_tolerance: 0.06
  default_patience_s: 30.0

description: >
  TOPReward (arXiv 2602.19313) as an NF4 reward rSkill on lerobot 0.6.0. A
  ZERO-SHOT reward: asks an off-the-shelf Qwen3-VL-4B VLM how likely the task
  instruction is given the rollout video, reading log P("True") as the signal.
  Per-frame progress (0-1) comes from lerobot's prefix sweep. Runs parallel to a
  VLA, queried on demand by the Reasoner. Advisory-only — never gates motors.
  Embodiment-agnostic. ADR-0057.

actions:
  - "monitor"

objects:
  - "task progress"
  - "task success"

scenes:
  - "tabletop"
  - "kitchen"
  - "indoor"
  - "manipulation"
