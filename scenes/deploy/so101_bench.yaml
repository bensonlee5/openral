# SO-101 laptop bench rig (ADR-0078 amendment) — converted from the retired
# deployments/so101.yaml RobotEnvironment.
#
# The `sensors:` entries are deploy-time bindings for the robot manifest's own
# `top` / `wrist` cameras (same names → scene entry wins; the manifest stays
# authoritative for frames/intrinsics). Host-specific by nature — retune the
# /dev/video* paths per host with `openral detect --deployment -i`.
#
# HAL facts (serial port + lerobot calibration identity) live in the `hal:`
# binding below (ADR-0078) — the HAL analogue of a sensor `deploy_binding` — so
# this scene is self-contained and needs no `--hal` overrides:
#
#   openral deploy run --config scenes/deploy/so101_bench.yaml
#
# The calibration is COMMITTED next to this scene
# (scenes/deploy/calibration/so_follower.json) so the deploy owns it instead of
# depending on whatever `<id>.json` is in the ambient HF cache; a relative
# `calibration_dir` resolves against THIS file's directory. `--hal` still wins
# over these for one-off host overrides (precedence: --hal > scene hal > robot.yaml).
scene:
  id: so101_bench
robot_id: so101_follower
# Host-specific HAL binding (ADR-0078). port: this arm enumerates on
# /dev/ttyACM0 (robot.yaml's generic default is /dev/ttyUSB0). id +
# calibration_dir load the committed Feetech calibration
# (calibration/so_follower.json, relative to this file); without it every
# send_action/read_state raises "has no calibration registered".
hal:
  defaults:
    port: "/dev/ttyACM0"
    id: "so_follower"
    calibration_dir: "calibration"
    calibrate_on_connect: false
sensors:
  # Both bench cameras deliver MJPG (`v4l2-ctl --list-formats-ext`); the
  # icspring wrist cam has no raw modes at all. `jpeg: true` (ADR-0082)
  # inserts the JPEG decode: `jpegdec` (CPU) on plain hosts, `nvjpegdec` in
  # the DeepStream container — where the decoded frame is born in NVMM and
  # the policy leg stays zero-copy on the GPU end to end. This retired the
  # wrist cam's raw-pipeline-string workaround (the builder previously could
  # not express an MJPG camera and v4l2src died with `not-negotiated (-4)`).
  - name: top
    modality: rgb
    frame_id: world
    rate_hz: 30.0
    deploy_binding:
      backend: gstreamer
      backend_params:
        source: usb
        device: /dev/video0
        width: 640
        height: 480
        fps: 30
        jpeg: true
  - name: wrist
    modality: rgb
    frame_id: wrist_camera
    rate_hz: 30.0
    deploy_binding:
      backend: gstreamer
      backend_params:
        source: usb
        device: /dev/video4
        width: 640
        height: 480
        fps: 30
        jpeg: true

# Committed deploy posture (DeployRuntime) — every runtime leg pinned
# explicitly so nothing depends on hidden CLI defaults. Precedence:
# CLI flag > this block > auto. The SO-101 bench is a fixed-base arm with two
# RGB cameras: no lidar/depth → SLAM/Nav2/octomap off; the continuous
# open-vocab detector stays on for locate_in_view; the reward monitor is on
# by default (ADR-0077 §4 auto-pairs Robometer from the VLA's
# reward_rskill_name; it scores /openral/cameras/top/image, which the
# ADR-0082 NVMM tier keeps publishing via the observability tee).
runtime:
  enable_slam: false
  enable_nav2: false
  enable_octomap: false
  enable_octomap_kernel_check: true
  enable_object_detector: true
  object_detector_onnx: null
  object_detector_manifest: null
  object_detector_query: null
  object_detector_locators: null
  enable_reward_monitor: true
  reward_monitor_manifest: null
  reward_monitor_task: null
  enable_critic: false
  spatial_memory_ingest: true
  approach_skill_id: null

# NOTE: an earlier `extra_allowed_collision_pairs: [[base, lower_arm]]` ACM
# override lived here to suppress a self-collision false-E-stop at the home pose
# (base<->lower_arm reported -0.078 m while the true clearance is +0.16 m). That
# was an expedient masking a geometry bug; it has been REMOVED. The real fix
# (ADR-0081 / issue #84) replaces the base's over-conservative capsule with a
# tight OBB in robots/so101_follower/robot.yaml, so base<->lower_arm (and
# base<->wrist) clear at reachable poses without loosening the ACM. Full base
# self-collision detection is restored.
